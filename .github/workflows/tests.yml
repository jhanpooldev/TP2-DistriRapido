name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - pytest y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      ENVIRONMENT: test
      # Valor exclusivo del pipeline. No es una credencial real ni se usa en
      # Staging o Produccion.
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: distrirapido_test
      DB_NAME_TEST: distrirapido_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: distrirapido_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas y cobertura
        # `python -m pytest` agrega el directorio actual (src/backend) a sys.path,
        # por lo que el paquete `app` es importable sin tocar codigo ni tests.
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend - Vitest y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npm run coverage

      - name: Publicar cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage
          if-no-files-found: ignore

  e2e:
    name: E2E - Playwright en Chromium, Firefox y WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: distrirapido_test
      DB_NAME_TEST: distrirapido_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: distrirapido_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependencias del frontend
        working-directory: src/frontend
        run: npm ci

      - name: Instalar navegadores de Playwright
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Ejecutar la suite E2E
        working-directory: src/frontend
        run: npm run test:e2e

      - name: Publicar reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          if-no-files-found: warn

      - name: Publicar resultados y trazas de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: src/frontend/test-results
          if-no-files-found: warn

      - name: Publicar evidencias visuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidencias
          path: docs/05 Evidencias/playwright-sprint4
          if-no-files-found: warn

  sonar:
    name: SonarQube (opcional)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Solo se ejecuta si el repositorio define SONAR_ENABLED=true y SONAR_TOKEN.
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura del backend
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: src/backend

      - name: Descargar cobertura del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage

      - name: Analisis SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
