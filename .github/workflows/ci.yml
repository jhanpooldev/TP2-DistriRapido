name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, dependencias y compilacion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.17.2

      - name: Verificar consistencia de dependencias
        run: pip check

      - name: Analisis estatico minimo
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Compilar e importar la aplicacion
        env:
          ENVIRONMENT: test
          # Valor exclusivo del pipeline. No es una credencial real.
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          python -m compileall -q app
          python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend - dependencias y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Compilar para produccion
        run: npm run build

      - name: Publicar build del frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/dist
          if-no-files-found: error
