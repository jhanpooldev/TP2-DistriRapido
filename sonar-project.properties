# Configuracion de SonarQube/SonarCloud para EcoLogistica Lima.
# El analisis se ejecuto localmente el 26/10/2026 con SonarQube Community en Docker
# y SonarScanner CLI. Las evidencias estan en docs/05 Evidencias/sonar-sprint3/.
# En CI requiere las variables SONAR_TOKEN y SONAR_ENABLED=true.
sonar.projectKey=jhanpooldev_TP2-DistriRapido
sonar.projectName=EcoLogistica Lima
sonar.projectVersion=1.0.0
sonar.organization=jhanpooldev

sonar.sources=src/backend/app,src/frontend/src
sonar.tests=src/backend/tests
sonar.test.inclusions=src/backend/tests/**/*.py,src/frontend/src/**/*.test.js

sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/coverage/**,**/*.min.js
sonar.python.version=3.12
sonar.python.coverage.reportPaths=src/backend/coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
